  <!-- ==== Prevención de pinch-to-zoom (iOS + Android) ==== -->
  <script>
  (function () {
    function onTouchStart(e) {
      if (e.touches && e.touches.length > 1) e.preventDefault();
    }
    function onGestureStart(e) { e.preventDefault(); }

    document.addEventListener('touchstart', onTouchStart, { passive: false });

    document.addEventListener('touchmove', function(e) {
      if (e.touches && e.touches.length > 1) e.preventDefault();
    }, { passive: false });

    document.addEventListener('gesturestart', onGestureStart);

    let lastTouch = 0;
    document.addEventListener('touchend', function (e) {
      const now = Date.now();
      if (now - lastTouch <= 300) e.preventDefault();
      lastTouch = now;
    }, { passive: false });

    window.addEventListener('unload', function () {
      document.removeEventListener('touchstart', onTouchStart);
      document.removeEventListener('gesturestart', onGestureStart);
    });
  })();
  </script>

  <!-- ====== COLOR DINÁMICO (DISEÑO APLICACIÓN) ====== -->
  <style id="colorBaseStyle">
    :root { --color-base: #11112b; --color-base-alt: #1e1e4a; --color-base-card: #dfdff0; }
  </style>
  <script>
  (function(){
    var PAGE = "carrodecompras";
    var COLOR_FABRICA = "#11112b";
    var KEY = "APP_COLOR_BASE_V1_" + PAGE;
    function applyColor(color){
      if(!color) return;
      var style = document.getElementById("colorBaseStyle");
      if(!style) return;
      var hex = color.replace("#","");
      if(hex.length!==6) return;
      var r=parseInt(hex.slice(0,2),16), g=parseInt(hex.slice(2,4),16), b=parseInt(hex.slice(4,6),16);
      var ra=Math.round(r*0.75), ga=Math.round(g*0.75), ba=Math.round(b*0.75);
      var toH=function(n){return("0"+n.toString(16)).slice(-2);};
      var alt="#"+toH(ra)+toH(ga)+toH(ba);
      var rc=Math.round(r*0.18+255*0.82), gc=Math.round(g*0.18+255*0.82), bc=Math.round(b*0.18+255*0.82);
      var card="#"+toH(rc)+toH(gc)+toH(bc);
      style.textContent=":root{--color-base:"+color+";--color-base-alt:"+alt+";--color-base-card:"+card+";}";
    }
    try{
      var cached=JSON.parse(localStorage.getItem(KEY)||"null");
      if(cached && cached.color) applyColor(cached.color);
    }catch(e){}
    window.addEventListener("load",function(){
      if(typeof google==="undefined"||!google.script||!google.script.run) return;
      google.script.run
        .withSuccessHandler(function(res){
          var norm=function(s){return s.replace(/\s+/g,"").toLowerCase();};
          var pageNorm=norm(PAGE);
          var colorFinal="";
          if(res&&res.ok&&res.reglas&&res.reglas.length){
            for(var i=0;i<res.reglas.length;i++){
              var r=res.reglas[i];
              var pNorm=norm(String(r.paginas||"").trim());
              var aplica=pNorm==="todas"||(pageNorm&&pNorm.split(",").map(function(p){return norm(p);}).indexOf(pageNorm)>=0);
              if(aplica){ colorFinal=r.color; break; }
            }
          }
          if(colorFinal){
            // Hay color asignado para esta página → guardar y aplicar
            try{localStorage.setItem(KEY,JSON.stringify({color:colorFinal,sig:res.signature,ts:Date.now()}));}catch(e){}
            applyColor(colorFinal);
          } else {
            // No hay regla para esta página → restaurar color de fábrica y limpiar cache
            try{localStorage.removeItem(KEY);}catch(e){}
            applyColor(COLOR_FABRICA);
          }
        })
        .withFailureHandler(function(){})
        .getColorDiseño();
    });
  })();
  </script>

<script id="gmTransicionGuardiaJS">
/* 🚪 TRANSICIÓN v2 — GUARDIA DE LA "PÁGINA FANTASMA" (bloque NUEVO, aditivo)
   En el teléfono, al volver a index el sistema vuelve a abrir la página que
   se acaba de dejar (ej. Carro) por ~2 s antes de mostrar index. Si esta
   página se abre así —justo después de haberla dejado con la barra/menú—,
   se mantiene su propio splash encima hasta que llega la página pedida
   (o máximo 10 s). Una visita normal no cambia en nada. */
(function(){
  "use strict";
  var PAG = "carrodecompras";
  window.__gmPag = PAG;
  var K = "GM_TRANSICION_V1", de = document.documentElement;
  // Limpieza: por si una copia guardada de la página trae restos de esto
  try{ de.classList.remove("gm-tr-espera"); var v = document.getElementById("gmTransicionGuardiaCSS"); if (v && v.parentNode) v.parentNode.removeChild(v); }catch(e){}
  var f = null;
  try{
    var a = null, b = null;
    try{ a = JSON.parse(sessionStorage.getItem(K) || "null"); }catch(e){}
    try{ b = JSON.parse(localStorage.getItem(K) || "null"); }catch(e){}
    f = (a && b) ? ((a.t >= b.t) ? a : b) : (a || b);
  }catch(e){}
  if (!f || !f.t || (Date.now() - f.t) > 15000 || f.desde !== PAG || !f.hacia || f.hacia === PAG) return;
  window.__gmTrFantasma = true;
  try{
    de.classList.add("gm-tr-espera");
    var st = document.createElement("style");
    st.id = "gmTransicionGuardiaCSS";
    st.textContent = "html.gm-tr-espera #splash-screen{display:flex!important;opacity:1!important;visibility:visible!important;animation:none!important;z-index:2147483646!important;pointer-events:auto!important}";
    (document.head || de).appendChild(st);
  }catch(e){}
  function soltar(){
    try{ de.classList.remove("gm-tr-espera"); var s = document.getElementById("gmTransicionGuardiaCSS"); if (s && s.parentNode) s.parentNode.removeChild(s); }catch(e){}
  }
  window.__gmTrSoltar = soltar;
  setTimeout(soltar, 10000);
  try{ window.addEventListener("storage", function(e){ if (e && e.key === K && !e.newValue) soltar(); }); }catch(e){}
})();
</script>

<script id="gmLogoFijoJS">
/* ═══════════════════════════════════════════════════════════════════
   📌 EL LOGO NUEVO MANDA SIEMPRE
   Esta página pide el logo a la hoja de cálculo por dos caminos que ya
   existían y que NO se tocaron: getSplashLogo() para el splash y
   getLogoCrearCuenta() para la barra superior. Cualquiera de los dos
   puede devolver el logo antiguo y pisarlo.

   En vez de editar esas funciones (romperíamos su caché y sus tiempos),
   este bloque se limita a vigilar el atributo src de las dos imágenes y
   a reponer el logo oficial cuando algo lo cambia. Es aditivo: borrando
   este bloque, la página vuelve a hacer exactamente lo de antes.
   ═══════════════════════════════════════════════════════════════════ */
(function(){
  var URL_LOGO = window.GM_LOGO_URL || "";
  var FUENTE   = window.GM_LOGO_B64 || URL_LOGO;   // primero el incrustado
  if (!FUENTE) return;

  var IDS = ["splash-logo", "logo"];
  var _arreglando = false;

  function fijar(el){
    if (!el) return;
    if (el.getAttribute("src") !== FUENTE){
      _arreglando = true;
      el.setAttribute("src", FUENTE);
      _arreglando = false;
    }
    // El logo es cuadrado: el "modo afiche" lo estiraría a pantalla completa
    if (el.classList && el.classList.contains("modo-afiche")) el.classList.remove("modo-afiche");
    if (!el._gmOnError){
      el._gmOnError = true;
      el.addEventListener("error", function(){
        // Si el navegador no entendiera el WEBP incrustado, se cae a la URL
        if (FUENTE !== URL_LOGO && URL_LOGO){ FUENTE = URL_LOGO; el.setAttribute("src", FUENTE); }
      });
    }
  }
  function fijarTodo(){ for (var i=0;i<IDS.length;i++) fijar(document.getElementById(IDS[i])); }

  fijarTodo();   // el splash ya está en el DOM: se pinta al instante

  // Vigía: repone el logo si el splash o la barra superior lo reemplazan
  try{
    var obs = new MutationObserver(function(muts){
      if (_arreglando) return;
      for (var i=0;i<muts.length;i++){
        var t = muts[i].target;
        if (t && t.id && IDS.indexOf(t.id) >= 0) fijar(t);
        else if (muts[i].type === "childList") fijarTodo();
      }
    });
    obs.observe(document.documentElement, {
      subtree: true, childList: true,
      attributes: true, attributeFilter: ["src", "class"]
    });
  }catch(e){}

  document.addEventListener("DOMContentLoaded", fijarTodo);
  // Redes de seguridad por si alguna respuesta del servidor llega tarde
  setTimeout(fijarTodo, 600);
  setTimeout(fijarTodo, 1800);
  setTimeout(fijarTodo, 3500);
})();
</script>

      <div id="avisoPaqueteMonedas" role="status" style="display:none; margin:12px 0; border:1px solid rgba(250,204,21,.55); background:rgba(250,204,21,.08); color:#fde68a; border-radius:14px; padding:14px 16px; font-weight:700; line-height:1.5;"></div>
      <style id="avisoPaqueteMonedasCSS">
        /* 📱 En celular el aviso se veía muy grande: letra más chica y compacta */
        #avisoPaqueteMonedas{ font-size:14px; }
        @media (max-width:720px), (hover:none) and (pointer:coarse){
          #avisoPaqueteMonedas{ font-size:12.5px !important; font-weight:600 !important; line-height:1.4 !important; padding:10px 12px !important; border-radius:12px !important; }
        }
      </style>

      <div class="footerbar">

          <div class="muted">Total</div>

          <div class="muted" id="filaDctoCarrito" style="display:none; color:#16a34a; font-weight:700;">
            🏷️ Descuento usuario nuevo <span id="dctoCarritoVal"></span>
          </div>

        <div style="display:flex;gap:10px;flex-wrap:wrap;">

  <!-- Nav inferior (igual que vender) -->

  <script>
    const SESSION_KEY = "mys_session_v1";
    function sessionGet(){
      try { return JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); } catch(e){ return null; }
    }
    function sessionClear(){
      try { localStorage.removeItem(SESSION_KEY); } catch(e){}
    }

    const WEBAPP_URL = window.PWA_APP_URL;
    const DEFAULT_REGISTRO_URL = WEBAPP_URL + "?page=crearcuenta";
    const DEFAULT_LOGIN_URL    = WEBAPP_URL + "?page=ingrezar";

    let _ctaUrls = { register: DEFAULT_REGISTRO_URL, login: DEFAULT_LOGIN_URL };

    function escapeHTML(s){
      return String(s ?? "")
        .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
    }
    function normalizeUrl(u){
      u = String(u || "").trim();
      if (!u) return "";

      // ✅ Corrige typos típicos (ej: "ohttps://")
      u = u.replace(/^ohttps:\/\//i, "https://").replace(/^ohttp:\/\//i, "http://");

      // soporta: www.xxx.cl, script.google.com/..., https://...
      if (!/^https?:\/\//i.test(u)) u = "https://" + u.replace(/^\/+/, "");
      return u;
    }

function goToUrl(url){
  try { window.top.location.href = url; }
  catch(e){ window.location.href = url; }
}

function redirectToIndex(){
  const url = WEBAPP_URL + "?page=index&v=" + Date.now();
  goToUrl(url);
}

    function forceIngresarUrl(url){
      url = String(url||"").trim();
      if (!url) return "";
      // Si no trae page=ingrezar/login, forzamos
      if (/[\?&]page=ingrezar\b/i.test(url) || /[\?&]page=login\b/i.test(url)) return url;
      return WEBAPP_URL + "?page=ingrezar";
    }
    function formatCLP(n){
      const num = Number(n||0)||0;
      return "$ " + num.toLocaleString("es-CL");
    }

    /* 🪙 MONEDA PROPIA DE G&M EN EL CARRO (solo visual)
       Los productos que se pagan con MONEDAS (todo menos los paquetes de
       monedas y las recargas) muestran la moneda propia en vez de "$".
       Toma el mismo texto que ya arma formatCLP/formatUnitPrice y solo le
       cambia el "$"/"CLP" por la moneda: los números y el cobro no cambian. */
    function _gmMonedaHtml_(txt){
      const num = String(txt == null ? "" : txt).replace(/\$|CLP/gi, "").trim();
      return `<span class="gm-pm"><span class="gm-coin" role="img" aria-label="monedas"></span><span class="gm-pm-num">${escapeHTML(num)}</span></span>`;
    }
    function _gmItemEnMonedas_(it){
      const prod = String(it && it.producto || "");
      if (/\(\s*MONEDAS\s+MASCOTAS\s*\)/i.test(prod)) return false;
      let meta = null;
      try { meta = (typeof prodMetaGet === "function") ? prodMetaGet(prod) : null; } catch(e){}
      return !(it && it.esRecarga) && !(meta && meta.esRecarga);
    }
    // El TOTAL va en monedas solo si TODO lo del carro se paga con monedas
    function _gmCarroEnMonedas_(){
      try{
        const s = sessionGet();
        const c = (s && s.email) ? cartCacheRead(String(s.email)) : null;
        const its = (c && Array.isArray(c.items)) ? c.items : [];
        return its.length > 0 && its.every(_gmItemEnMonedas_);
      }catch(e){ return false; }
    }

    function cartBadgeSet(n){
      const b = document.getElementById("qaCartBadge");
      const num = Math.max(0, Number(n||0)||0);
      if (!b) return;
      b.textContent = String(num);
      b.style.display = num>0 ? "flex" : "none";
    }

    /* ══════════════════════════════════════════════════
       🎁 DESCUENTO "1RA COMPRA" — reflejado en el Carro
       Si el usuario activó el botón en el index (localStorage),
       se re-verifica en el servidor y se refleja en el total.
    ══════════════════════════════════════════════════ */
    let _dcto1raActivoCarrito = false;
    let _dcto1raPorcentajeCarrito = 0;

    function _pintarTotalConDescuentoCarrito(totalBase){
      const totalEl  = document.getElementById("grandTotal");
      const filaDcto = document.getElementById("filaDctoCarrito");
      const dctoVal  = document.getElementById("dctoCarritoVal");

      const total = Number(totalBase || 0) || 0;
      let totalFinal = total;
      let monto = 0;

      if (_dcto1raActivoCarrito && _dcto1raPorcentajeCarrito > 0){
        monto = Math.round(total * (_dcto1raPorcentajeCarrito / 100));
        totalFinal = total - monto;
      }

      if (filaDcto){
        if (monto > 0){
          filaDcto.style.display = "block";
          if (dctoVal){
            if (_gmCarroEnMonedas_()) dctoVal.innerHTML = "- " + _gmMonedaHtml_(formatCLP(monto)); // 🪙
            else dctoVal.textContent = "- " + formatCLP(monto) + " CLP";
          }
        } else {
          filaDcto.style.display = "none";
        }
      }

      if (totalEl){
        if (_gmCarroEnMonedas_()) totalEl.innerHTML = _gmMonedaHtml_(formatCLP(totalFinal)); // 🪙
        else totalEl.textContent = formatCLP(totalFinal);
      }
    }

    function _cargarEstadoDcto1raCarrito(){
      let st = null;
      try { st = JSON.parse(localStorage.getItem("mys_dcto1ra_v1") || "null"); } catch(e){}
      if (!st || !st.activo) return;

      const s = sessionGet();
      const email = (s && s.email) ? s.email : "";
      if (!email) return;
      if (!(google?.script?.run && google.script.run.getEstadoDcto1raCompra)) return;

      google.script.run
        .withSuccessHandler((res) => {
          if (!res || !res.ok || !res.mostrar || !res.porcentaje){
            _dcto1raActivoCarrito = false;
            _dcto1raPorcentajeCarrito = 0;
            try { localStorage.removeItem("mys_dcto1ra_v1"); } catch(e){}
          } else {
            _dcto1raActivoCarrito = true;
            _dcto1raPorcentajeCarrito = Number(res.porcentaje) || 0;
          }
          const cached = cartCacheRead(email);
          if (cached) _pintarTotalConDescuentoCarrito(Number(cached.totalCompra || 0) || 0);
        })
        .withFailureHandler(() => {})
        .getEstadoDcto1raCompra(email);
    }

    function renderCart(res){
      const list = document.getElementById("cartList");
      const total = document.getElementById("grandTotal");
      const est = document.getElementById("estadoCompra");
      const btnFin = document.getElementById("btnFinalizar");

      // ✅ Filtrar productos que están siendo eliminados (evita que reaparezcan por latencia del backend)
const rawItems = (res && res.items) ? res.items : [];
const items = (typeof _pendingDelete !== "undefined" && _pendingDelete.size > 0)
  ? rawItems.filter((it) => !_pendingDelete.has(String(it && it.producto || "").trim()))
  : rawItems;

const totalCompra = items.reduce((acc, it) => acc + (Number(it && it.total || 0) || 0), 0);
const estado = String(res && res.estado || "").trim();
const stockSignature = String(res && res.stockSignature || "").trim();

// ✅ guardar cache del carrito para pintarlo instantáneamente en la próxima carga
const s = sessionGet();
if (s && s.email){
  cartCacheWrite(String(s.email), {
    items,
    totalCompra,
    estado
  });
}

// ✅ si cambió la firma del stock en PRODUCTOS, se borra el cache viejo
stockCacheInvalidateIfChanged(stockSignature);

// ✅ guardar stock actual de cada producto del carro
items.forEach((it) => {
  const prod = String(it && it.producto || "").trim();
  const stock = Number(it && it.stockDisponible);
  if (prod && Number.isFinite(stock)) {
    stockCacheSet(prod, stock, stockSignature);
  }
});

      _pintarTotalConDescuentoCarrito(totalCompra);
      est.textContent = estado ? ("Estado: " + estado) : "";

      cartBadgeSet(items.reduce((a,x)=>a+(Number(x.cantidad)||0),0));
      btnFin.disabled = items.length === 0;
      _avisoPaqueteMonedasCarro_(items); // 🪙 solo muestra/oculta un aviso

      if (!items.length){
  const s = sessionGet();
  if (s && s.email) {
    cartCacheWrite(String(s.email), { items: [], totalCompra: 0, estado });
  } else {
    cartCacheClear();
  }

  list.innerHTML = `<div class="empty">Tu carro está vacío.</div>`;
  return;
}

      list.innerHTML = items.map((it) => {
        const nombre = escapeHTML(it.producto||"");
        const qty = Number(it.cantidad||0)||0;
        const tot = Number(it.total||0)||0;

        // selector SIEMPRE 1..10
const qtySafe = Math.max(1, Math.min(10, qty || 1));
const opts = Array.from({ length: 10 }, (_, i) => {
  const v = i + 1;
  return `<option value="${v}" ${v === qtySafe ? "selected" : ""}>${v}</option>`;
}).join("");

        const prodAttr = escapeHTML(String(it.producto || "").trim());
const meta = prodMetaGet(it.producto) || null;

const nombreMostrar = escapeHTML((meta && meta.nombre) || (it.producto || ""));
const descMostrar = escapeHTML((meta && meta.descripcion) || "");
const imgUrl = escapeHTML((meta && meta.imagenUrl) || "");
const precioUnidad = formatUnitPrice(meta && meta.precio, qtySafe, tot);

// 💰 RECARGA SALDO: cambian las etiquetas de la fila
const esRecargaRow = !!(it.esRecarga || (meta && meta.esRecarga));
const lblUnidad = esRecargaRow ? "Valor recarga mínima" : "Valor unidad";
const lblTotal  = esRecargaRow ? "Total recarga"        : "Total producto";
// 🪙 Se paga con monedas → se muestra la moneda propia (paquetes de monedas y recargas siguen en $)
const enMonedasRow = _gmItemEnMonedas_(it);

const ff = escapeHTML(String((meta && meta.fontFamily) || "Orbitron").replace(/"/g, ""));
const fs = Number((meta && meta.fontSize) || 16) || 16;
const descStyle = `font-family:${ff}, sans-serif; font-size:${fs}px;`;

const descSegunda = meta && meta.descSegunda;
const badgeSegundaUnidad = descSegunda
  ? `<div class="cart-2da-badge" style="margin-top:4px; font-size:12.5px; font-weight:700; color:#15803d;">
       🎁 2ª unidad con ${descSegunda.pct}% dscto (retiro en tienda, válido ${descSegunda.horas}h)
     </div>`
  : ``;

return `
  <div class="row" data-prod="${prodAttr}" data-qty="${qtySafe}" data-monedas="${enMonedasRow ? "1" : "0"}">

    <!-- IMAGEN (izquierda) -->
    <div class="row-left">
      ${imgUrl ? `
        <div class="cart-prod-imgwrap">
          <img src="${imgUrl}" alt="${nombreMostrar}" draggable="false">
        </div>
      ` : ``}
    </div>

    <!-- INFO (centro) -->
    <div class="row-right">
      <div class="cart-prod-text">
        <p class="pname">${nombreMostrar}</p>
        ${descMostrar ? `<p class="cart-prod-desc" style="${descStyle}">${descMostrar}</p>` : ``}
        <div class="cart-unit-price">${lblUnidad}: ${enMonedasRow ? _gmMonedaHtml_(precioUnidad) : precioUnidad}</div>
        ${badgeSegundaUnidad}
      </div>
    </div>

    <!-- CONTROLES (derecha) -->
    <div class="row-controls">
      <div class="controls">
        <select class="qty" data-prev="${qtySafe}" aria-label="Cantidad">${opts}</select>
        <button class="btn danger btnRemove" type="button">Eliminar</button>
      </div>
      <div class="row-total-label">${lblTotal}</div>
      <div class="ptotal">${enMonedasRow ? _gmMonedaHtml_(formatCLP(tot)) : formatCLP(tot)}</div>
      <div class="muted msg" style="display:none;"></div>
    </div>

  </div>
`;
      }).join("");
    }

    /* 🪙 PAQUETES DE MONEDAS SOLOS EN EL CARRO (aviso)
       Google Play cobra 1 producto por compra y un paquete de monedas no se
       paga con monedas; por eso mezclado con otros productos no hay cómo
       pagarlo. CodeGIFT.gs ya no deja armar esa mezcla (addToMiCarro), pero
       un carro armado ANTES de esa regla puede venir mezclado: aquí se avisa.
       👉 Mismos nombres que _PLAY_BILLING_PRODUCTOS (finalizarcompraGIFT),
          PLAY_PRODUCTOS (CodeGIFT.gs) y PRODUCT_IDS (BillingHelper.kt). */
    const _PAQUETES_MONEDAS_PLAY = [
      "5000 MONEDAS(MONEDAS MASCOTAS)",
      "10000 MONEDAS(MONEDAS MASCOTAS)",
      "15000 MONEDAS(MONEDAS MASCOTAS)"
    ];
    let _avisoPMItems = [];
    let _playBillingCarro = null; // null = aún no se sabe
    try {
      const c = JSON.parse(localStorage.getItem("mys_cache_play_billing_v1") || "null");
      if (c && typeof c.activo === "boolean") _playBillingCarro = c.activo;
    } catch(e){}
    function _avisoPaqueteMonedasCarro_(items){
      try {
        _avisoPMItems = Array.isArray(items) ? items : [];
        const aviso = document.getElementById("avisoPaqueteMonedas");
        if (!aviso) return;
        const lineas = _avisoPMItems.filter(it => (Number(it && it.cantidad) || 0) > 0);
        const packs  = lineas.filter(it => _PAQUETES_MONEDAS_PLAY.includes(String(it.producto || "").trim()));
        const problema = packs.length && (lineas.length > 1 || (Number(packs[0].cantidad) || 0) !== 1);
        // Con PLAY BILLING en NO todo se paga junto por transferencia: sin aviso.
        if (!problema || _playBillingCarro !== true){ aviso.style.display = "none"; return; }
        aviso.textContent = "🪙 Los paquetes de monedas se compran solos. " +
          "Deja solo el paquete (cantidad 1) para pagarlo con Google Play; " +
          "luego pagas lo demás con esas monedas.";
        aviso.style.display = "";
      } catch(e){}
    }
    // Confirmar el interruptor con el servidor (una vez) y re-evaluar el aviso.
    function _consultarPlayBillingCarro_(){
      try {
        if (window.google && google.script && google.script.run && google.script.run.getPlayBillingActivo){
          google.script.run.withSuccessHandler((activo) => {
            _playBillingCarro = !!activo;
            try { localStorage.setItem("mys_cache_play_billing_v1", JSON.stringify({ ts: Date.now(), activo: _playBillingCarro })); } catch(e){}
            _avisoPaqueteMonedasCarro_(_avisoPMItems);
          }).withFailureHandler(() => {}).getPlayBillingActivo();
        }
      } catch(e){}
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", _consultarPlayBillingCarro_);
    else _consultarPlayBillingCarro_();

    function loadCart(){
  const s = sessionGet();
  if (!s || !s.email){
    cartCacheClear();
    const u = forceIngresarUrl(_ctaUrls.login);
    window.top.location.href = u || DEFAULT_LOGIN_URL;
    return;
  }

  const email = String(s.email);

  // ✅ Resetear el flag antes de cargar (nueva carga = nueva oportunidad)
  _serverCartLoaded = false;

  // ✅ Siempre limpiar el cache local antes de consultar el servidor.
  // Esto evita mostrar productos de una compra ya pagada cuando el
  // servidor ya limpió el carrito. El cache se reconstruye con la
  // respuesta fresca del servidor.
  cartCacheClear();

  // ✅ Siempre limpiar el DOM y mostrar spinner al iniciar loadCart.
  // Esto evita que quede contenido viejo visible mientras se espera al servidor,
  // independientemente de si hay cache o no.
  const list = document.getElementById("cartList");
  if (list) {
    list.innerHTML = `<div class="cart-loading">
      <div class="cart-spinner"></div>
      <span>Cargando tu carro...</span>
    </div>`;
  }

  // ✅ Traer versión real desde backend
  google.script.run.withSuccessHandler((res)=>{
    // ✅ PRIMERO activar el flag, LUEGO renderizar
    // Así cualquier callback de loadCartProductMeta que llegue después
    // no podrá sobreescribir con datos del cache viejo
    _serverCartLoaded = true;
    if (res && res.ok){
      renderCart(res);
    } else {
      cartCacheClear();
      const list = document.getElementById("cartList");
      if (list) list.innerHTML = '<div class="empty">Tu carro está vacío.</div>';
    }
  }).getMiCarro(email);
}

  function updateItem(producto, qty, sel, qtyAnterior){
  const s = sessionGet();
  if (!s || !s.email) return;

  const email = String(s.email);
  const qtyNum = Math.max(1, Math.min(10, Number(qty || 0) || 1));
  const qtyPrev = Math.max(1, Math.min(10, Number(qtyAnterior || 0) || 1));

  const restaurar = (msg) => {
    if (sel){
      sel.value = String(qtyPrev);
      sel.dataset.prev = String(qtyPrev);
      sel.disabled = false;
    }
    cartCachePatchQty(email, producto, qtyPrev);
    refrescarTotalDesdeCache(email);
    alert(msg || "No se pudo actualizar la cantidad.");
  };

  // Validacion rapida con cache de stock local
  const stockCacheado = stockCacheGet(producto);
  if (Number.isFinite(stockCacheado) && qtyNum > stockCacheado){
    restaurar("Stock insuficiente. Disponible: " + stockCacheado);
    return;
  }

  // INMEDIATO: actualizar selector y data-prev
  if (sel){
    sel.value = String(qtyNum);
    sel.dataset.prev = String(qtyNum);
    sel.disabled = true;
  }

  // INMEDIATO: parchear cache con nueva cantidad y recalcular total
  cartCachePatchQty(email, producto, qtyNum);

  // INMEDIATO: actualizar "Total producto" en la fila del DOM
  if (sel){
    const row = sel.closest(".row");
    if (row){
      const cachedNow = cartCacheRead(email);
      const prodKey = String(producto || "").trim();
      if (cachedNow && Array.isArray(cachedNow.items)){
        const itNow = cachedNow.items.find((x) => String(x && x.producto || "").trim() === prodKey);
        if (itNow){
          const ptotalEl = row.querySelector(".ptotal");
          if (ptotalEl){
            if (row.getAttribute("data-monedas") === "1") ptotalEl.innerHTML = _gmMonedaHtml_(formatCLP(Number(itNow.total || 0) || 0)); // 🪙
            else ptotalEl.textContent = formatCLP(Number(itNow.total || 0) || 0);
          }
        }
      }
    }
  }

  // INMEDIATO: actualizar total global en el footer
  refrescarTotalDesdeCache(email);

  google.script.run
    .withSuccessHandler((res) => {
      const stockSignature = String(res && res.stockSignature || "").trim();
      if (stockSignature) stockCacheInvalidateIfChanged(stockSignature);

      const stockDisponible = Number(res && res.stockDisponible);
      if (Number.isFinite(stockDisponible)) stockCacheSet(producto, stockDisponible, stockSignature);

      if (sel) sel.disabled = false;

      if (res && res.ok){
        // No re-renderizamos el DOM completo para no resetear data-prev.
        // Si el backend devuelve el carrito completo, actualizamos solo el cache.
        if (res.items && Array.isArray(res.items)){
          cartCacheWrite(email, {
            items: res.items,
            totalCompra: Number(res.totalCompra || 0) || 0,
            estado: String(res.estado || "").trim()
          });
          refrescarTotalDesdeCache(email);
        }
        return;
      }

      const msg = (res && (res.msg || res.message || res.error)) ||
        "No hay stock disponible para esa cantidad.";
      restaurar(msg);
    })
    .withFailureHandler((err) => {
      if (sel) sel.disabled = false;
      const msg = (err && err.message) ? err.message : "No se pudo actualizar la cantidad.";
      restaurar(msg);
    })
    .updateMiCarroItem(email, producto, qtyNum);
}

// Actualiza SOLO el total global en footer sin re-renderizar la lista
function refrescarTotalDesdeCache(email){
  const cached = cartCacheRead(String(email || ""));
  if (!cached) return;
  _pintarTotalConDescuentoCarrito(Number(cached.totalCompra || 0) || 0);
}

    // ✅ Set de productos en proceso de eliminación (evita que reaparezcan por latencia del backend)
const _pendingDelete = new Set();

    function removeItem(producto){
  const s = sessionGet();
  if (!s || !s.email) return;

  const email = String(s.email);
  const prodKey = String(producto || "").trim();

  // ✅ 1) Marcar como "en eliminación" ANTES de cualquier otra operación
  _pendingDelete.add(prodKey);

  // ✅ 2) Limpiar cache del carrito para ese producto específico
  cartCacheRemoveItem(email, prodKey);

  // ✅ 3) Limpiar también el cache de stock de ese producto
  //       para que no quede stock "viejo" de un producto ya eliminado
  stockCacheRemoveItem(prodKey);

  // ✅ 4) Repintar UI inmediatamente desde cache ya actualizado
  const cached = cartCacheRead(email);
  renderCart({
    ok: true,
    items: cached && Array.isArray(cached.items) ? cached.items : [],
    totalCompra: cached ? Number(cached.totalCompra || 0) || 0 : 0,
    estado: cached ? String(cached.estado || "").trim() : ""
  });

const INDEX_PROD_CACHE_KEY = "APP_PROD_V1";

    function cacheRead(key, maxAge){
      try{
        const raw = localStorage.getItem(key);
        if (!raw) return null;
        const o = JSON.parse(raw);
        if (!o || !o.ts) return null;
        if (Date.now() - o.ts > maxAge) return null;
        return o;
      } catch(e){ return null; }
    }
    function cacheWrite(key, payload){
      try{
        const o = { ts: Date.now(), ...payload };
        localStorage.setItem(key, JSON.stringify(o));
      } catch(e){}
    }

function stockCacheRead(){
  const o = cacheRead(CACHE.stock.key, CACHE.stock.maxAge);
  if (!o || typeof o !== "object") return { signature:"", items:{} };
  return {
    signature: String(o.signature || ""),
    items: (o.items && typeof o.items === "object") ? o.items : {}
  };
}

function stockCacheWrite(signature, items){
  cacheWrite(CACHE.stock.key, {
    signature: String(signature || ""),
    items: items || {}
  });
}

function stockCacheInvalidateIfChanged(signature){
  const sig = String(signature || "");
  if (!sig) return;

  const cached = stockCacheRead();
  const oldSig = String(cached.signature || "");

  if (oldSig && oldSig !== sig){
    try { localStorage.removeItem(CACHE.stock.key); } catch(e){}
  }
}

function stockCacheSet(producto, stock, signature){
  const key = String(producto || "").trim().toLowerCase();
  const val = Number(stock);
  if (!key || !Number.isFinite(val)) return;

  let cached = stockCacheRead();
  const sig = String(signature || "");

  if (sig && cached.signature && cached.signature !== sig){
    cached = { signature: sig, items: {} };
  }

  if (sig) cached.signature = sig;
  cached.items[key] = Math.max(0, Math.floor(val));

  stockCacheWrite(cached.signature, cached.items);
}

function stockCacheGet(producto){
  const key = String(producto || "").trim().toLowerCase();
  if (!key) return null;

  const cached = stockCacheRead();
  const n = Number(cached.items[key]);
  return Number.isFinite(n) ? n : null;
}

// ✅ Elimina el stock cacheado de un producto específico sin tocar los demás
function stockCacheRemoveItem(producto){
  const key = String(producto || "").trim().toLowerCase();
  if (!key) return;

  const cached = stockCacheRead();
  if (!cached || !cached.items || !Object.prototype.hasOwnProperty.call(cached.items, key)) return;

  delete cached.items[key];
  stockCacheWrite(cached.signature, cached.items);
}

function cartCacheRead(email){
  const e = String(email || "").trim().toLowerCase();
  if (!e) return null;

  const o = cacheRead(CACHE.cart.key, CACHE.cart.maxAge);
  if (!o || !o.email || !o.data) return null;

  if (String(o.email || "").trim().toLowerCase() !== e) return null;

  return o.data;
}

function cartCacheWrite(email, data){
  const e = String(email || "").trim().toLowerCase();
  if (!e || !data || typeof data !== "object") return;

  cacheWrite(CACHE.cart.key, {
    email: e,
    data: {
      ok: true,
      items: Array.isArray(data.items) ? data.items : [],
      totalCompra: Number(data.totalCompra || 0) || 0,

}

function formatUnitPrice(rawPrecio, qty, totalProducto){
  const raw = String(rawPrecio || "").trim();
  if (raw){
    const n = Number(raw.replace(/[^\d.-]/g, ""));
    return Number.isFinite(n) && n > 0 ? formatCLP(n) : raw;
  }

  const q = Number(qty || 0) || 0;
  const t = Number(totalProducto || 0) || 0;
  return formatCLP(q > 0 ? Math.round(t / q) : 0);
}

function prodMetaRead(){
  const o = cacheRead(CACHE.prodMeta.key, CACHE.prodMeta.maxAge);
  if (!o || typeof o !== "object") return { signature:"", items:{} };
  return {
    signature: String(o.signature || ""),
    items: (o.items && typeof o.items === "object") ? o.items : {}
  };
}

function prodMetaWrite(itemsMap, signature){
  cacheWrite(CACHE.prodMeta.key, {
    items: itemsMap || {},
    signature: String(signature || "")
  });
}

function prodMetaBuildMap(items){
  const map = {};
  (Array.isArray(items) ? items : []).forEach((p) => {
    const key = String(p && p.nombre || "").trim().toLowerCase();
    if (!key) return;

    map[key] = {
      nombre: String(p && p.nombre || "").trim(),
      descripcion: String(p && p.descripcion || "").trim(),
      imagenUrl: normalizeUrl(String(p && p.imagenUrl || "").trim()),
      precio: String(p && p.precio || "").trim(),
      fontFamily: String(p && p.fontFamily || "Orbitron").replace(/"/g, ""),
      fontSize: Number(p && p.fontSize || 16) || 16,
      descSegunda: (p && p.descSegunda) ? { pct: Number(p.descSegunda.pct)||0, horas: Number(p.descSegunda.horas)||0 } : null,
      esRecarga: !!(p && p.esRecarga)   // 💰 RECARGA SALDO
    };
  });
  return map;
}

function prodMetaWarmFromIndexCache(){
  try{
    const raw = localStorage.getItem(INDEX_PROD_CACHE_KEY);
    if (!raw) return;

    const data = JSON.parse(raw);
    const items = Array.isArray(data && data.items) ? data.items : [];
    const signature = String(data && data.signature || "").trim();

    if (!items.length) return;

    const current = prodMetaRead();
    if (current.signature === signature && Object.keys(current.items || {}).length) return;

    // ✅ Se COMPLETA la caché en vez de reemplazarla: así no se borran las
    //    fichas de productos que viven en hojas de CATEGORÍA (ni la que index
    //    escribe al tocar "Agregar"), que es lo que dejaba el carro sin imagen.
    prodMetaWrite(Object.assign({}, current.items, prodMetaBuildMap(items)), signature);
  } catch(e){}
}

function prodMetaGet(producto){
  const key = String(producto || "").trim().toLowerCase();
  if (!key) return null;

  const cached = prodMetaRead();
  return cached.items[key] || null;
}

function loadCartProductMeta(){
  // ✅ 1) reutiliza altiro el cache del catálogo de index si existe
  prodMetaWarmFromIndexCache();
  // ✅ también carga cache de categorías si existen
  prodMetaWarmFromCatCaches();

  // ✅ 2) actualiza metadata desde hoja PRODUCTOS principal
  google.script.run.withSuccessHandler((res) => {
    const items = (res && res.items) ? res.items : [];
    // Merge con lo que ya hay (no borrar metadata de categorías)
    const current = prodMetaRead();
    const merged = Object.assign({}, current.items, prodMetaBuildMap(items));
    prodMetaWrite(merged, res && res.signature || "");
    // ✅ Solo enriquecer imágenes/nombres ya pintados en el DOM.
    // NO re-renderizar el carrito (evita restaurar ítems de pedidos pagados).
    _enrichCartImagesOnly();
  }).getProductos();

  // ✅ 3) cargar categorías y su metadata en cascada
  google.script.run.withSuccessHandler((resCats) => {
    const cats = (resCats && resCats.items) ? resCats.items : [];
    if (!cats.length) return;
    // Cargar cada categoría en paralelo
    cats.forEach((cat) => {
      // Primero intentar desde cache local de index
      const catCacheKey = "APP_CAT_PROD_" + String(cat||"").trim().toUpperCase().replace(/\s+/g,"_") + "_V1";
      try {
        const raw = localStorage.getItem(catCacheKey);
        if (raw) {
          const data = JSON.parse(raw);
          const catItems = Array.isArray(data && data.items) ? data.items : [];
          if (catItems.length) {
            const current = prodMetaRead();
            const merged = Object.assign({}, current.items, prodMetaBuildMap(catItems));
            prodMetaWrite(merged, current.signature || "");
          }
        }
      } catch(e){}

      // Luego pedir al backend para tener datos frescos
      google.script.run
        .withSuccessHandler((resCat) => {
          const catItems = (resCat && resCat.items) ? resCat.items : [];
          if (!catItems.length) return;
          const current = prodMetaRead();
          const merged = Object.assign({}, current.items, prodMetaBuildMap(catItems));
          prodMetaWrite(merged, current.signature || "");
          // ✅ Solo enriquecer imágenes/nombres ya pintados en el DOM.
          // NO re-renderizar el carrito (evita restaurar ítems de pedidos pagados).
          _enrichCartImagesOnly();
        })
        .withFailureHandler(() => {}) // silenciar errores individuales
        .getProductosPorCategoria(cat);
    });
  })
  .withFailureHandler(() => {})
  .getCategoriasProductos();
}

// el carrito completo, NO escribe en el cache y NO puede restaurar ítems viejos.
// Solo busca filas ya pintadas y les agrega la imagen/nombre si faltaban.
function _enrichCartImagesOnly(){
  try {
    const rows = document.querySelectorAll("#cartList .row[data-prod]");
    if (!rows || !rows.length) return;
    rows.forEach((row) => {
      const prod = String(row.getAttribute("data-prod") || "").trim();
      if (!prod) return;
      const meta = prodMetaGet(prod);
      if (!meta) return;

      // Imagen
      const imgWrap = row.querySelector(".row-left");
      if (imgWrap && !imgWrap.querySelector("img") && meta.imagenUrl) {
        const url = escapeHTML(String(meta.imagenUrl || "").trim());
        if (url) {
          imgWrap.innerHTML = `<div class="cart-prod-imgwrap"><img src="${url}" alt="${escapeHTML(meta.nombre || prod)}" draggable="false"></div>`;
        }
      }

      // Nombre (solo si aún muestra el nombre clave sin formato)
      const pname = row.querySelector(".pname");
      if (pname && meta.nombre) {
        pname.textContent = meta.nombre;
      }

      // Descripción
      const desc = row.querySelector(".cart-prod-desc");
      if (desc && meta.descripcion) {
        desc.textContent = meta.descripcion;
      }
    });
  } catch(e) {}
}

function cartCacheRemoveItem(email, producto){
  const e = String(email || "").trim().toLowerCase();
  const prod = String(producto || "").trim();
  if (!e || !prod) return;

  const cached = cartCacheRead(e);
  if (!cached || !Array.isArray(cached.items)) return;

  const items = cached.items.filter((it) => String(it && it.producto || "").trim() !== prod);
  const totalCompra = items.reduce((acc, it) => acc + (Number(it && it.total || 0) || 0), 0);

  cartCacheWrite(e, {
    items,
    totalCompra,
    estado: String(cached.estado || "").trim()
  });
}

function cartCachePatchQty(email, producto, nuevaQty){
  const e = String(email || "").trim().toLowerCase();
  const prod = String(producto || "").trim();
  const qty = Math.max(1, Math.min(10, Number(nuevaQty || 0) || 1));

  if (!e || !prod) return;

  const cached = cartCacheRead(e);
  if (!cached || !Array.isArray(cached.items)) return;

  let changed = false;

  const items = cached.items.map((it) => {
    if (String(it && it.producto || "").trim() !== prod) return it;

    const cantidadAnterior = Number(it && it.cantidad || 0) || 0;
    const totalAnterior = Number(it && it.total || 0) || 0;
    const precioUnitario = cantidadAnterior > 0 ? (totalAnterior / cantidadAnterior) : 0;

    changed = true;

    return {
      ...it,
      cantidad: qty,
      total: precioUnitario > 0 ? Math.round(precioUnitario * qty) : totalAnterior
    };
  });

  if (!changed) return;

  const totalCompra = items.reduce((acc, it) => acc + (Number(it && it.total || 0) || 0), 0);

  cartCacheWrite(e, {
    items,
    totalCompra,
    estado: String(cached.estado || "").trim()
  });
}

      // 4) Pedir logo fresco al backend con precarga (evita parpadeos)

          google.script.run.withSuccessHandler((res)=>{
            if (!res || !res.url || !logoEl) return;

            const newUrl = String(res.url);
            const newSig = (res.signature) ? String(res.signature) : "";
            const oldSig = localStorage.getItem(KEY_SIG);

            // Si no cambió la firma, asegura src correcto sin parpadeo
            if (oldSig && oldSig === newSig){
              if (logoEl.src !== newUrl) logoEl.src = newUrl;
              return;

            // ✅ Precarga antes de aplicar
            const pre = new Image();
            pre.onload = () => {

              logoEl.src = newUrl;

          }).getLogoCrearCuenta();

      // 5) Pre-cargar/actualizar “LOGO INICIO” en background (para que el click sea instantáneo)
      try{

            const sig = (res && res.signature) ? String(res.signature) : "";

            if (!url){

            if (!old || old !== sig){
              localStorage.setItem(LOGO_INICIO_URL, url);
              localStorage.setItem(LOGO_INICIO_SIG, sig);
            } else {
              if (!localStorage.getItem(LOGO_INICIO_URL)) localStorage.setItem(LOGO_INICIO_URL, url);

  // ============================================================
  (function initSplash() {
    var SPLASH_DEFAULT   = "https://i.imgur.com/MHb7x08.png";
    var SPLASH_KEY       = "APP_SPLASH_CARRO_DE_COMPRAS_V1";  // cache URL por página
    var SPLASH_SEEN_KEY  = "mys_splash_carro_de_compras_v1"; // sessionStorage

    var splashEl = document.getElementById("splash-screen");
    var imgEl    = document.getElementById("splash-logo");

    // ── Ayuda: adaptar imagen si es tipo afiche (más alta que ancha) ──
    function adaptarImagen(img) {
      if (!img || !img.naturalWidth || !img.naturalHeight) return;
      var ratio = img.naturalHeight / img.naturalWidth;
      if (ratio > 1.2) {          // es más alta que ancha → afiche
        img.classList.add("modo-afiche");
      } else {
        img.classList.remove("modo-afiche");
      }
    }

    // ── Ocultar splash con animación ──
    function hideSplash() {
      if (!splashEl) return;
      splashEl.classList.add("hide");
      setTimeout(function() { if (splashEl) splashEl.style.display = "none"; }, 950);
    }

    // ── Guard: ocultar solo una vez ──
    var _hidden = false;
    function hideOnce() {
      if (_hidden) return;
      _hidden = true;
      try { sessionStorage.setItem(SPLASH_SEEN_KEY, "1"); } catch(e) {}
      hideSplash();
    }

    // ── Leer cache localStorage ──
    function cacheGet() {
      try {
        var raw = localStorage.getItem(SPLASH_KEY);
        if (!raw) return null;
        var obj = JSON.parse(raw);
        // Cache válido 7 días
        if (!obj || !obj.url || (Date.now() - (obj.ts||0)) > 7*24*3600*1000) return null;
        return obj;
      } catch(e) { return null; }
    }

    function cacheSet(url) {
      try {
        localStorage.setItem(SPLASH_KEY, JSON.stringify({ url: url, ts: Date.now() }));
      } catch(e) {}
    }

    // ── Si ya fue mostrado en esta sesión → ocultar al instante ──
    try {
      if (sessionStorage.getItem(SPLASH_SEEN_KEY) === "1") {
        if (splashEl) splashEl.style.display = "none";
        return;
      }
    } catch(e) {}

    // ── 1) Pintar imagen desde cache si existe (instantáneo) ──
    var cached = cacheGet();
    if (cached && cached.url) {
      imgEl.src = cached.url;
      imgEl.onload = function() { adaptarImagen(imgEl); };
      if (imgEl.complete && imgEl.naturalWidth) adaptarImagen(imgEl);
    } else {
      // Primera vez → imagen por defecto ya está en el src del HTML
      imgEl.onload = function() { adaptarImagen(imgEl); };
      if (imgEl.complete && imgEl.naturalWidth) adaptarImagen(imgEl);
    }

    // ── 2) Llamar a GAS para obtener URL fresca de la columna "CARRO DE COMPRAS" ──
    if (typeof google === "undefined" || !google.script || !google.script.run) {
      setTimeout(hideOnce, 900);
      return;
    }

    google.script.run
      .withSuccessHandler(function(res) {
        var url = (res && res.url) ? res.url : "";
        if (!url) { setTimeout(hideOnce, 900); return; }

        var pre = new Image();
        pre.onload = function() {
          imgEl.src = url;
          cacheSet(url);
          adaptarImagen(imgEl);
          // Verificar ratio de nuevo tras cargar
          if (!imgEl.complete || !imgEl.naturalWidth) {
            imgEl.onload = function() { adaptarImagen(imgEl); };
          }
          setTimeout(hideOnce, 180);
        };
        pre.onerror = function() {
          // Fallback: usar lo que ya está pintado
          setTimeout(hideOnce, 900);
        };
        pre.src = url;
        // Máximo de espera: 2.5s
        setTimeout(hideOnce, 2500);
      })
      .withFailureHandler(function() { setTimeout(hideOnce, 900); })
      .getSplashLogo("CARRO DE COMPRAS");
  })();

<!-- ══════════════════════════════════════════════════════════════════════
     🎛️ INTERRUPTORES MAESTROS — sincronización con GESTION FUNCIONES
     Consulta getFuncionesActivas() cada pocos segundos y pone/quita clases
     en <html>. El CSS de abajo esconde lo que corresponda.
     No toca ninguna lógica existente: solo agrega o quita clases.
     ══════════════════════════════════════════════════════════════════════ -->
<style>
  /* 💰 SALDO apagado → desaparecen saldo disponible, devolución y pagar con saldo */
  html.gfn-off-saldo #saldoDevRow,
  html.gfn-off-saldo #saldoUsuarioBox,
  html.gfn-off-saldo #devolucionSaldoRow,
  html.gfn-off-saldo #btnDevolucionSaldo,
  html.gfn-off-saldo #devSaldoModal,
  html.gfn-off-saldo #wrapSaldo { display: none !important; }

  /* 🏷️ DCTO 1RA COMPRA apagado */
  html.gfn-off-dcto1ra #btnDcto1raCompra { display: none !important; }

  /* 🎟️ CODIGO DCTO apagado → bloque "¿Tienes un código de descuento?" */
  html.gfn-off-codigodcto #descuentoWrap { display: none !important; }

  /* 🛍️ VENDER apagado → pestaña inferior, menú hamburguesa y sobre de mensajes.
     Los elementos los marca _gfnMarcarVender() con data-gfn-vender="1",
     porque el nav y el drawer se pintan por JavaScript y no tienen un id fijo. */
  html.gfn-off-vender [data-gfn-vender="1"],
  html.gfn-off-vender #qaBell,
  html.gfn-off-vender #qaBellDesk,
  html.gfn-off-vender #qaBellBadge,
  html.gfn-off-vender #qaBellBadgeDesk { display: none !important; }
</style>
<script>
(function(){
  // Cada cuántos milisegundos se pregunta al servidor por el estado
  var GFN_INTERVALO = 30000;  // 🔋 oct 2026: 4 s → 30 s (al volver a la pantalla se consulta al tiro)   // lo más rápido posible sin saturar el servidor
  var _gfnPrevio = null;
  var _gfnPrevioVender = null;   // 🛍️ para detectar SOLO los cambios de VENDER

  function _gfnAplicar(f){
    var h = document.documentElement;
    if (!h) return;
    h.classList.toggle("gfn-off-saldo",          f.saldo          === false);
    h.classList.toggle("gfn-off-dcto1ra",        f.dcto1ra        === false);
    h.classList.toggle("gfn-off-vender",         f.vender         === false);
    h.classList.toggle("gfn-off-codigodcto",     f.codigoDcto     === false);
    h.classList.toggle("gfn-off-efectivo",       f.efectivo       === false);
    h.classList.toggle("gfn-off-transferencias", f.transferencias === false);
    _gfnMarcarVender();
  }

  // 🛍️ Marca los accesos a VENDER del nav inferior y del menú hamburguesa.
  //    Se hace por JavaScript (y no solo con CSS) porque esos bloques se
  //    pintan dinámicamente y el enlace puede identificarse por su URL o por
  //    el texto visible. Marcar no oculta nada: el CSS de arriba decide.
  function _gfnMarcarVender(){
    try {
      // OJO: en esta página el menú plegable se arma con elementos DIV que
      //      llevan la clase drawer-item, y no con enlaces A como en
      //      index/cuenta/miscompras. Por eso el selector incluye las dos
      //      formas: si no, el enlace VENDER del menú no se marcaba.
      var sel = '#bottomNav .nav-item, .bottom-nav .nav-item, ' +
                '#drawerPages a, #drawerPages .drawer-item, ' +
                '.drawer-list a, .drawer-list .drawer-item';
      document.querySelectorAll(sel).forEach(function(el){
        var url  = String(el.getAttribute("data-url")  || "").toLowerCase();
        var name = String(el.getAttribute("data-name") || "").toLowerCase();
        var txt  = String(el.textContent || "").toLowerCase();
        var esVender = (url.indexOf("vender") >= 0) ||
                       (name.indexOf("vender") >= 0) ||
                       (txt.indexOf("vender") >= 0);
        if (esVender) el.setAttribute("data-gfn-vender", "1");
        else if (el.hasAttribute("data-gfn-vender")) el.removeAttribute("data-gfn-vender");
      });
    } catch(e){}
  }

  // El nav y el drawer se repintan solos; hay que volver a marcarlos al vuelo.
  function _gfnVigilarVender(){
    try {
      if (typeof MutationObserver === "undefined") return;
      var obs = new MutationObserver(function(){ _gfnMarcarVender(); });
      ["bottomNav", "drawerPages"].forEach(function(id){
        var el = document.getElementById(id);
        if (el) obs.observe(el, { childList: true, subtree: true });
      });
      document.querySelectorAll(".bottom-nav, .drawer-list").forEach(function(el){
        obs.observe(el, { childList: true, subtree: true });
      });
    } catch(e){}
  }

  // Cuando una función se vuelve a ENCENDER hay que repintar sus datos,
  // porque mientras estuvo apagada el servidor devolvía vacío o cero.
  function _gfnRefrescar(f){
    try { if (f.saldo !== false && typeof _cargarSaldoUsuario === "function") _cargarSaldoUsuario(); } catch(e){}
    try { if (f.saldo !== false && typeof _pintarSaldo        === "function") _pintarSaldo();        } catch(e){}
    try { if (f.saldo !== false && typeof _consultarSaldoDisponible === "function") _consultarSaldoDisponible(0); } catch(e){}
    try { if (f.dcto1ra !== false && typeof _checkDcto1raCompra === "function") _checkDcto1raCompra(); } catch(e){}
    try { if (typeof cargarMediosDePago      === "function") cargarMediosDePago();      } catch(e){}
    try { if (typeof actualizarPanelBancario === "function") actualizarPanelBancario(); } catch(e){}

    // 🛍️ VENDER: al encender hay que reconstruir nav, menú y sobre de mensajes.
    //    _venderVerificarEnVivo (index) consulta usuarioPuedeVender y repinta
    //    las tres cosas de una vez. En cuenta/miscompras se recarga el nav.
    try {
      if (f.vender !== false){
        var _s = (typeof sessionGet === "function") ? sessionGet() : null;
        var _em = (_s && _s.email) ? String(_s.email) : "";
        if (_em && typeof _venderVerificarEnVivo === "function") _venderVerificarEnVivo(_em);
        if (typeof loadNav === "function") loadNav();
        var _pg = document.getElementById("drawerPages");
        if (_pg && typeof renderDrawerList === "function" &&
            typeof cacheRead === "function" && typeof CACHE !== "undefined"){
          var _nc = cacheRead(CACHE.nav.key, CACHE.nav.maxAge);
          if (_nc && Array.isArray(_nc.items)) renderDrawerList(_pg, _nc.items);
        }
      }
    } catch(e){}
    _gfnMarcarVender();
  }

  var _gfnEnVuelo = 0;   // 🔋 hora de la consulta que sigue esperando respuesta
  function _gfnConsultar(){
    if (typeof google === "undefined" || !google.script || !google.script.run) return;
    if (document.visibilityState === "hidden") return;                       // 🔋 sin pantalla visible no se pregunta
    if (_gfnEnVuelo && (Date.now() - _gfnEnVuelo) < 20000) return;           // 🔋 no se apilan consultas
    _gfnEnVuelo = Date.now();
    google.script.run
      .withSuccessHandler(function(res){
        _gfnEnVuelo = 0;
        if (!res || !res.ok) return;
        var firma = [res.saldo, res.dcto1ra, res.vender,
                     res.codigoDcto, res.efectivo, res.transferencias].join("|");
        _gfnAplicar(res);
        if (_gfnPrevio !== null && firma !== _gfnPrevio) _gfnRefrescar(res);

        // 🛍️ PUBLICACIONES DE USUARIOS EN LA PANTALLA LED
        // loadLED() solo se ejecutaba al abrir la página, así que al cambiar
        // VENDER las publicaciones seguían igual hasta recargar a mano.
        // Se vuelve a llamar SOLO cuando VENDER cambió de estado (encendido o
        // apagado), nunca en cada consulta: es la misma función que usa la
        // página al arrancar, así que el contenido de la hoja PANTALLAS LED
        // se vuelve a traer y a pintar exactamente igual que siempre.
        if (_gfnPrevioVender !== null && res.vender !== _gfnPrevioVender) {
          try { if (typeof loadLED === "function") loadLED(); } catch(e){}
        }
        _gfnPrevioVender = res.vender;

        _gfnPrevio = firma;
      })
      .withFailureHandler(function(){ _gfnEnVuelo = 0; })
      .getFuncionesActivas();
  }

  function _gfnIniciar(){
    _gfnMarcarVender();
    _gfnVigilarVender();
    _gfnConsultar();
    setInterval(_gfnConsultar, GFN_INTERVALO);
    // Al volver a la pestaña se consulta al tiro, sin esperar el intervalo
    document.addEventListener("visibilitychange", function(){
      if (!document.hidden) _gfnConsultar();
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", _gfnIniciar);
  } else {
    _gfnIniciar();
  }
})();
</script>

<script>
  // 🪙 Chip de saldo de monedas en el topbar del carro. Esta página no tiene
  // el widget de mascota (#mcCoins), así que se consulta directo al
  // servidor con getMonedasDisponibles — misma fuente de verdad que usa
  // finalizarcompraGIFT.html e indexGIFT.html.
  (function(){
    function pintar(valor){
      var el = document.getElementById("gmTopCoins");
      // 🪙 con la moneda propia de G&M (antes emoji)
      if (el) el.innerHTML = '<span class="gm-coin" role="img" aria-label="monedas"></span><span>' + (Number(valor)||0).toLocaleString("es-CL") + '</span>';
    }
    function refrescar(){
      var s = (typeof sessionGet === "function") ? sessionGet() : null;
      if (!s || !s.email || !window.google || !google.script || !google.script.run) return;
      google.script.run
        .withSuccessHandler(function(res){ if (res && res.ok) pintar(res.monedas); })
        .withFailureHandler(function(){})
        .getMonedasDisponibles(String(s.email));
    }
    if (document.readyState === "loading"){
      document.addEventListener("DOMContentLoaded", refrescar);
    } else { refrescar(); }
    // 🪙 Además de pintarlo al cargar, se refresca cada 15s (misma llamada,
    // sin caché de por medio) para que un cambio del administrador en la
    // hoja se vea solo, sin que el usuario tenga que recargar la página.
    try{ setInterval(refrescar, 15000); }catch(e){}
  })();

<!-- ══════════════════════════════════════════════════════════════════════
     🚪 TRANSICIÓN ENTRE PÁGINAS (bloque NUEVO, 100% aditivo)
     PROBLEMA: al volver a la portada (index es la página más pesada), el
     teléfono quita su pantalla negra de carga ANTES de que llegue la página
     nueva, y por un par de segundos se volvía a ver la página anterior
     (parecía que se recargaba) y recién después aparecía index.
     SOLUCIÓN: apenas el usuario sale de esta página (barra de abajo, menú,
     cualquier botón que cambie de página), se muestra al tiro una COPIA del
     mismo splash de la app (logo + partículas + barra de carga). Así, mientras
     la página nueva llega, lo que se ve es la pantalla de carga, nunca la
     página anterior.
     • Es una copia: el splash original y sus tiempos no se tocan.
     • Si un toque no cambia de página, la copia se quita sola a los 4 s; si
       la página nueva nunca llega (sin señal), a los 25 s. Los links a
       WhatsApp y redes no la activan.
     • Volver con "atrás" a una página guardada en memoria: se quita al tiro.
     v2: además anota a qué página se va (barra/menú), para que la "guardia"
     del inicio del <body> sepa reconocer si el teléfono vuelve a abrir esta
     misma página por un momento antes de la pedida, y la tape con el splash.
     ══════════════════════════════════════════════════════════════════════ -->
<script id="gmTransicionJS">
(function(){
  "use strict";
  if (window.__gmTransicion) return;
  window.__gmTransicion = true;
  var copia = null, tiempo = 0, saliendo = false;
  var K = "GM_TRANSICION_V1";
  var PAG = String(window.__gmPag || (document.body && document.body.getAttribute("data-page")) || "").toLowerCase();
  // Restos de una copia guardada de la página (no deben verse nunca)
  try{ var viejos = document.querySelectorAll("[data-gm-transicion]"); for (var i = 0; i < viejos.length; i++) viejos[i].parentNode.removeChild(viejos[i]); }catch(e){}
  function borrarNota(){ try{ sessionStorage.removeItem(K); }catch(e){} try{ localStorage.removeItem(K); }catch(e){} }
  function leerNota(){
    var a = null, b = null;
    try{ a = JSON.parse(sessionStorage.getItem(K) || "null"); }catch(e){}
    try{ b = JSON.parse(localStorage.getItem(K) || "null"); }catch(e){}
    return (a && b) ? ((a.t >= b.t) ? a : b) : (a || b);
  }
  // Llegó una página de verdad (no la fantasma): la nota ya cumplió
  if (!window.__gmTrFantasma){
    try{ var n0 = leerNota(); if (n0 && (n0.desde !== PAG || !n0.t || (Date.now() - n0.t) > 15000)) borrarNota(); }catch(e){}
  }
  // 🚪 Aviso a la app Android: "esta página ya llegó" (retira su capa de transición)
  //    v2: se avisa recién cuando la página YA se dibujó en pantalla (2 cuadros
  //    después de armarse), no apenas se lee el código. Respaldo a los 6 s.
  try{
    if (PAG && window.AndroidBridge && typeof window.AndroidBridge.paginaLista === "function"){
      var avisado = false;
      var avisar = function(){ if (avisado) return; avisado = true; try{ window.AndroidBridge.paginaLista(PAG); }catch(e){} };
      var trasPintar = function(){
        try{ requestAnimationFrame(function(){ requestAnimationFrame(function(){ setTimeout(avisar, 60); }); }); }catch(e){ setTimeout(avisar, 300); }
      };
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", trasPintar); else trasPintar();
      setTimeout(avisar, 6000);
    }
  }catch(e){}
  // A qué página lleva un link (?page=...). Sin page = portada (index)
  function paginaDe(u){
    try{
      var m = /[?&]page=([^&#]*)/i.exec(u);
      var p = m ? decodeURIComponent(m[1]) : "index";
      p = String(p || "index").toLowerCase().replace(/\.html$/, "").replace(/gift$/, "");
      if (p === "login") p = "ingrezar";
      return p || "index";
    }catch(e){ return ""; }
  }
  // ms = cuánto esperar antes de quitar la copia si la página no cambia
  function tapar(ms){
    try{
      ms = (typeof ms === "number") ? ms : 25000;
      if (saliendo) ms = 25000;   // ya se confirmó que la página se va
      if (copia){ clearTimeout(tiempo); tiempo = setTimeout(destapar, ms); return; }
      var s = document.getElementById("splash-screen");
      if (!s) return;
      copia = s.cloneNode(true);
      copia.removeAttribute("class");
      copia.setAttribute("data-gm-transicion", "1");
      copia.setAttribute("aria-hidden", "true");
      var st = copia.style;
      st.setProperty("display", "flex", "important");
      st.setProperty("opacity", "1", "important");
      st.setProperty("visibility", "visible", "important");
      st.setProperty("animation", "none", "important");
      st.setProperty("z-index", "2147483646", "important");
      st.setProperty("pointer-events", "auto", "important");
      // Si el logo aún no había cargado, no se muestra el ícono de imagen rota
      var oi = s.querySelector("#splash-logo"), ci = copia.querySelector("#splash-logo");
      if (ci && (!oi || !oi.complete || !oi.naturalWidth)) ci.style.setProperty("visibility", "hidden", "important");
      document.body.appendChild(copia);
      clearTimeout(tiempo);
      tiempo = setTimeout(destapar, ms);
    }catch(e){}
  }
  function destapar(){
    clearTimeout(tiempo);
    try{ if (copia && copia.parentNode) copia.parentNode.removeChild(copia); }catch(e){}
    copia = null; saliendo = false;
  }
  // 1) Cualquier salida de la página (el navegador avisa antes de irse)
  //    (confirma el cambio de página: la copia queda puesta hasta que llegue la nueva)
  window.addEventListener("beforeunload", function(){ saliendo = true; tapar(25000); });
  window.addEventListener("pagehide", function(){ saliendo = true; tapar(25000); });
  // 2) Barra de abajo y menú: se tapa en el mismo toque (respuesta inmediata)
  document.addEventListener("click", function(e){
    try{
      var el = e.target && e.target.closest && e.target.closest(".nav-item[data-url], .drawer-item[data-url], #drawerPages a[data-url], .drawer-list a[data-url], #drawer a[data-url]");
      if (!el) return;
      var u = String(el.getAttribute("data-url") || "").trim();
      if (!u || /^(#|javascript:|mailto:|tel:)/i.test(u) || /wa\.me|whatsapp|instagram\.com|facebook\.com|tiktok\.com|youtube\.com|youtu\.be/i.test(u)) return;
      //    Nota de viaje (desde → hacia) para la guardia de la página siguiente
      try{
        var hacia = el.classList.contains("active") ? PAG : paginaDe(u);
        //    🚪 La app Android tapa al tiro con su splash hasta que llegue "hacia"
        try{ if (hacia && window.AndroidBridge && typeof window.AndroidBridge.iniciarTransicion === "function") window.AndroidBridge.iniciarTransicion(hacia); }catch(e){}
        if (!window.__gmTrFantasma && PAG && hacia && hacia !== PAG){
          var nota = JSON.stringify({ desde: PAG, hacia: hacia, t: Date.now() });
          try{ sessionStorage.setItem(K, nota); }catch(e){}
          try{ localStorage.setItem(K, nota); }catch(e){}
        }
      }catch(e){}
      //    Si el toque no llegó a cambiar de página (ej. abrió una ventanita),
      //    la copia se quita sola a los 4 s.
      setTimeout(function(){ tapar(4000); }, 0);
    }catch(err){}
  }, true);
  // 3) Si se vuelve a esta página con "atrás" (guardada en memoria): se destapa
  window.addEventListener("pageshow", function(ev){ if (ev && ev.persisted) destapar(); });
})();
</script>
